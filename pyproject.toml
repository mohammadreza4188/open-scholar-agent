[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-scholar-agent"
version = "0.1.0"
description = "Open-source, multi-user AI opportunity research and application assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23"]
telegram = ["python-telegram-bot>=21,<22"]

[project.scripts]
open-scholar = "open_scholar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
